<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIRE | Panel de Visualizador</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="js/theme.js"></script>
</head>
<body class="bg-white">
  
  <!-- Encabezado básico -->
  <header class="p-3 border-bottom d-flex justify-content-between align-items-center">
    <span class="fs-5 fw-bold text-dark">AIRE | Calidad del aire</span>
    <div class="d-flex align-items-center gap-3">

        <!-- Botón mágico del Modo Oscuro -->
        <button onclick="toggleDarkMode()" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-moon-stars"></i>
        </button>

      <span class="badge bg-info text-dark border">Visualizador</span>
      <button id="btn-salir" class="btn btn-sm btn-outline-danger">Cerrar sesión</button>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container mt-5">
    <div class="text-center">
      <h1 class="display-6 mb-3">Bienvenido, <span id="nombre-usuario" class="text-primary"></span></h1>
      <p class="lead text-muted">Este es tu panel de lectura.</p>
      <p class="text-secondary small">Próximamente aquí verás los datos y reportes de calidad del aire.</p>
    </div>
  </main>

  <script src="js/visualizador.js"></script>
</body>
</html>
