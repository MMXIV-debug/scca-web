<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AIRE | Panel de Visualizador</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body class="dashboard-body visualizador-body">
  
  <!-- Encabezado visible durante el desplazamiento -->
  <header class="header-scca py-2 px-3 px-md-4">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
    <span class="brand-text fs-5">AIRE | Calidad del aire</span>
    <div class="header-actions d-flex align-items-center gap-3">

        <!-- Botón mágico del Modo Oscuro -->
        <button onclick="toggleDarkMode()" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-moon-stars"></i>
        </button>

      <span class="badge bg-info text-dark border">Visualizador</span>
      <button id="btn-salir" class="btn-salir" type="button">Cerrar sesión</button>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="dashboard-content p-3 p-md-4" tabindex="0" aria-label="Contenido del visualizador">
    <div class="container pt-4">
    <div class="text-center">
      <h1 class="display-6 mb-3">Bienvenido, <span id="nombre-usuario" class="text-primary"></span></h1>
      <p class="lead text-muted">Este es tu panel de lectura.</p>
      <p class="text-secondary small">Próximamente aquí verás los datos y reportes de calidad del aire.</p>
    </div>
    </div>
  </main>

  <script src="js/visualizador.js"></script>
</body>
</html>
