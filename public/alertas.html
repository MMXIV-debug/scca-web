<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIRE | Alertas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-4"><a href="dashboard.html">Volver a administración</a><h1 class="mt-3">Alertas</h1>
<p>La inactividad indica falta de recepción de muestras, no confirma un daño del sensor. Atender registra la intervención; la alerta técnica se resuelve cuando vuelve la recepción o el equipo sale de supervisión.</p>
<p id="mensaje" role="status" aria-live="polite"></p><section id="contenido" hidden>
<label for="estado">Estado</label><select id="estado"><option value="abierta">Abiertas</option><option value="atendida">Atendidas</option><option value="resuelta">Resueltas</option><option value="todas">Todas</option></select>
<button id="actualizar" class="btn btn-secondary btn-sm">Actualizar</button><button id="comprobar" class="btn btn-outline-primary btn-sm">Comprobar inactividad</button>
<div class="table-responsive"><table class="table mt-3"><thead><tr><th>ID / nodo</th><th>Regla y observación</th><th>Estado</th><th>Atención</th></tr></thead><tbody id="filas"></tbody></table></div>
<button id="siguiente" class="btn btn-outline-secondary">Siguiente página</button></section></main><script src="js/alertas.js"></script></body></html>
