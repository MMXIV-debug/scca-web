<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SCCA - Acceso</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos globales -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

  <main class="card card-scca p-4 m-auto">
    <div class="text-center mb-1 logo-badge">◆ SCCA ◆</div>
    <h1 class="h4 text-center mb-4 titulo-scca">Calidad del Aire</h1>

    <!-- Pestañas de Acceso / Registro -->
    <ul class="nav nav-pills nav-fill tabs-wrapper mb-3" id="pills-tab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#panel-login" type="button" role="tab" aria-selected="true">Ingresar</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-register" data-bs-toggle="pill" data-bs-target="#panel-register" type="button" role="tab" aria-selected="false">Registrarme</button>
      </li>
    </ul>

    <!-- Formularios -->
    <div class="tab-content" id="pills-tabContent">
      <!-- Iniciar Sesión -->
      <section class="tab-pane fade show active" id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <form id="form-login" novalidate>
          <div class="mb-2">
            <input id="lu" class="form-control" placeholder="Usuario" required autocomplete="username">
          </div>
          <div class="mb-3">
            <input id="lp" type="password" class="form-control" placeholder="Contraseña" required autocomplete="current-password">
          </div>
          <button id="btn-login" class="btn btn-scca w-100" type="submit">
            <span>Entrar</span>
          </button>
        </form>
      </section>

      <!-- Registrarse -->
      <section class="tab-pane fade" id="panel-register" role="tabpanel" aria-labelledby="tab-register">
        <form id="form-register" novalidate>
          <div class="mb-2">
            <input id="ru" class="form-control" placeholder="Usuario" required autocomplete="username">
          </div>
          <div class="mb-2">
            <input id="rn" class="form-control" placeholder="Nombre completo" required>
          </div>
          <div class="mb-2">
            <input id="re" type="email" class="form-control" placeholder="Email (opcional)" autocomplete="email">
          </div>
          <div class="mb-2">
            <input id="rp" type="password" class="form-control" placeholder="Contraseña (mín. 8)" minlength="8" required autocomplete="new-password">
          </div>
          <div class="mb-3">
            <select id="rr" class="form-select">
              <option value="Visualizador">Visualizador</option>
              <option value="Administrador">Administrador</option>
            </select>
          </div>
          <button id="btn-register" class="btn btn-scca w-100" type="submit">
            <span>Solicitar acceso</span>
          </button>
        </form>
      </section>
    </div>

    <!-- Alertas dinámicas -->
    <div id="feedback-alert" class="alert d-none mt-3 p-2 text-center small rounded-3" role="alert"></div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- JavaScript global de login -->
  <script src="js/app.js"></script>
</body>
</html>
